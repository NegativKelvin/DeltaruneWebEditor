name: ci
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The pinned build only changes with the script (tag and commit are in it).
      - name: Cache UndertaleModCli
        id: utmt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/utmt
          key: utmt-linux-x64-${{ hashFiles('scripts/build-utmt.sh') }}
      - name: Build UndertaleModCli (pinned, same script as the release)
        if: steps.utmt-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: scripts/build-utmt.sh linux-x64 "$RUNNER_TEMP/utmt"
      - name: Install xdelta3 (interop test of .xdelta patches)
        run: sudo apt-get update && sudo apt-get install -y xdelta3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          DRE_TEST_UTMT: ${{ runner.temp }}/utmt/UndertaleModCli/UndertaleModCli
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: for f in $(find web/js -name '*.js'); do echo "$f"; node --input-type=module --check < "$f"; done
      - name: Test JavaScript (battle simulator, room preview, cutscene timeline, text measure)
        run: node --test web/tests/*.test.mjs
