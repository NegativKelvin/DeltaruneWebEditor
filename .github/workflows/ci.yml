name: ci
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build UndertaleModCli (pinned, same script as the release)
        working-directory: .
        run: scripts/build-utmt.sh linux-x64 "$RUNNER_TEMP/utmt"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          DRE_TEST_UTMT: ${{ runner.temp }}/utmt/UndertaleModCli/UndertaleModCli
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: for f in $(find web/js -name '*.js'); do echo "$f"; node --input-type=module --check < "$f"; done
      - name: Test JavaScript (battle simulator, room preview rules)
        run: node --test web/tests/*.test.mjs
