name: ci
on:
  push:
  pull_request:
env:
  UTMT_TAG: 0.9.2.0
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build UndertaleModCli
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$UTMT_TAG" --recurse-submodules --shallow-submodules https://github.com/UnderminersTeam/UndertaleModTool utmt-src
          dotnet publish utmt-src/UndertaleModCli -c Release -o utmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          DRE_TEST_UTMT: ${{ runner.temp }}/utmt/UndertaleModCli
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: for f in $(find web/js -name '*.js'); do echo "$f"; node --input-type=module --check < "$f"; done
      - name: Test JavaScript (battle simulator, room preview rules)
        run: node --test web/tests/*.test.mjs
