[package]
name = "dre-server"
version = "0.1.0"
edition = "2024"
description = "Local backend for the Deltarune web mod editor. Wraps UndertaleModTool CLI."
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
lzma-rs = "0.3"
oxidelta = { version = "0.1.4", default-features = false, features = ["adler32"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
